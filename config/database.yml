default: &default
  pool: 10
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST") %>
  port: <%= ENV.fetch("DB_PORT") %>
  database: <%= ENV.fetch("DB_NAME") %>
  username: <%= ENV.fetch("DB_USERNAME") %>
  password: <%= ENV.fetch("DB_PASSWORD") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: smart_gallery_development

test:
  <<: *default
  database: smart_gallery_test

production:
  primary: &primary_production
    <<: *default
    database: smart_gallery_production
    username: smart_gallery
    password: <%= ENV["SMART_GALLERY_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: smart_gallery_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: smart_gallery_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: smart_gallery_production_cable
    migrations_paths: db/cable_migrate
